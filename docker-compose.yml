name: curso-js

services:
  db:
    image: mongo:latest
    container_name: mongodb_blog
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: curso-js-api
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: node_api_blog
    restart: always
    ports:
      - "3900:3900"
    environment:
      - PORT=3900
      - MONGODB_URI=mongodb://db:27017/api_rest_blog
    volumes:
      - ./Backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  mongo_data:
